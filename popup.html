<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17PLUS 快速设置</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <!-- SatinAu 流光动态背景色块 -->
    <div class="color-bg color-bg-1"></div>
    <div class="color-bg color-bg-2"></div>
    <div class="color-bg color-bg-3"></div>
    <div class="color-bg color-bg-4"></div>

    <div class="main-container">
        <!-- 头部标题 -->
        <div class="header-card">
            <div class="title-wrap">
                <h3>17PLUS</h3>
                <a href="https://satinau.cn/" target="_blank" rel="noopener noreferrer" class="author-link">by SatinAu</a>
            </div>
        </div>

        <!-- 主导航分段选择器 -->
        <div class="segmented-control main-nav" id="pageNavControl">
            <div class="segment-glider"></div>
            <button type="button" class="segment-btn active" data-page="feature">功能</button>
            <button type="button" class="segment-btn" data-page="ui">界面</button>
        </div>

        <!-- 功能二级页面 -->
        <div id="page-feature" class="page-view active">
            <!-- 功能开关 -->
            <div class="setting-item">
                <div class="setting-label">
                    <span class="label-title">启用名单修改</span>
                    <span class="label-desc">开启后将应用下方名单规则</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="enableCustom">
                    <span class="switch-slider"></span>
                </label>
            </div>

            <!-- 模式分段选择器 -->
            <div class="segmented-control" id="modeControl">
                <div class="segment-glider"></div>
                <button type="button" class="segment-btn active" data-value="replace">完全替换模式</button>
                <button type="button" class="segment-btn" data-value="modify">增删改模式</button>
            </div>

            <!-- 替换模式面板 -->
            <div id="panel-replace" class="glass-panel active">
                <div class="panel-header">
                    <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    <h4>替换名单 (每行一个):</h4>
                </div>
                <textarea id="customList" placeholder="张三&#10;李四&#10;王五"></textarea>
            </div>

            <!-- 增删改模式面板 -->
            <div id="panel-modify" class="glass-panel">
                <div class="panel-header modify-header-bar">
                    <div class="panel-header-left">
                        <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        <h4>学生名单 (<span id="modifyCount">0</span>人)</h4>
                    </div>
                    <button type="button" class="btn-text" id="btnResetModify" title="恢复为网页获取到的原名单">重置</button>
                </div>

                <div class="student-list-container" id="studentListContainer"></div>

                <div class="add-student-box">
                    <input type="text" id="addStudentInput" placeholder="输入新学生姓名..." maxlength="20">
                    <button type="button" id="btnAddStudent" class="btn-add-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span>添加</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 界面二级页面 -->
        <div id="page-ui" class="page-view">
            <div class="setting-item">
                <div class="setting-label">
                    <span class="label-title">动画效果</span>
                    <span class="label-desc">开启面板与菜单的弹出动画</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="enableAnimation" checked>
                    <span class="switch-slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <div class="setting-label">
                    <span class="label-title">毛玻璃模糊</span>
                    <span class="label-desc">开启面板与弹窗的高斯模糊背景</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="enableBlur" checked>
                    <span class="switch-slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <div class="setting-label">
                    <span class="label-title">隐藏 AI 浮窗</span>
                    <span class="label-desc">隐藏页面中的 AI 助手悬浮入口</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="hideAiChat" checked>
                    <span class="switch-slider"></span>
                </label>
            </div>
        </div>

        <!-- 底部保存区 -->
        <button id="save" class="btn-save">
            <span>保存并应用</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        </button>

        <div class="tip-box">保存后刷新页面生效</div>
    </div>

    <!-- SatinAu iOS 风格 Toast -->
    <div id="toast" class="toast"></div>

    <script src="popup.js"></script>
</body>
</html>
