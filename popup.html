<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>17PLUS 快速设置</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fff; /* 弹出窗口通常用纯白背景 */
            padding: 15px;
            width: 280px; /* 稍微调窄一点适应 Popup */
            color: #333;
            margin: 0;
        }
        h3 {
            margin-top: 0;
            font-size: 16px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: flex;
            align-items: center;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }
        input[type="checkbox"] {
            margin-right: 8px;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-top: 6px;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            box-sizing: border-box;
            resize: none; /* 禁止拖动大小 */
            font-family: monospace;
        }
        textarea:focus {
            outline: none;
            border-color: #007bff;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-top: 5px;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .status {
            margin-top: 5px;
            font-size: 12px;
            color: #28a745;
            text-align: center;
            height: 14px;
            line-height: 14px;
        }
        .tip {
            font-size: 11px;
            color: #888;
            margin-top: 8px;
            text-align: center;
        }

        .panel {
            display: none; /* 默认隐藏所有面板 */
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 4px;
            background-color: #f9f9f9;
            margin-top: 10px;
        }

        .panel.active {
            display: block; /* 只有激活的面板显示 */
        }

        h4 {
            font-size: 13px;
            margin: 10px 0 5px 0;
            color: #555;
        }

        .note {
            font-size: 11px;
            color: #999;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <h3>17PLUS 设置</h3>
    
    <div class="form-group">
        <label><input type="checkbox" id="enableCustom"> 启用名单修改功能</label>
    </div>

    <div class="mode-switch">
        <label><input type="radio" name="mode" value="replace" checked> 完全替换模式</label>
        <label><input type="radio" name="mode" value="modify"> 增删改模式</label>
    </div>

    <div id="panel-replace" class="panel">
        <h4>替换为以下名单:</h4>
        <textarea id="customList" placeholder="张三&#10;李四&#10;王五"></textarea>
    </div>

    <div id="panel-modify" class="panel">
        <h4>1. 添加学生 (每行一个):</h4>
        <textarea id="addList" placeholder="新同学A&#10;新同学B"></textarea>
        
        <h4>2. 删除学生 (每行一个):</h4>
        <textarea id="delList" placeholder="要删除的名字A"></textarea>
        
        <h4>3. 修改名字 (格式: 旧名=新名):</h4>
        <div class="note">例如: 张三=张三丰</div>
        <textarea id="renameList" placeholder="张三=张三丰&#10;李四=李小四"></textarea>
    </div>

    <button id="save" class="btn-primary" style="margin-top:15px;">保存并应用</button>
    <div id="status" class="status"></div>
    <div class="tip">保存后请刷新页面生效</div>

    <script src="popup.js"></script>
</body>
</html>
